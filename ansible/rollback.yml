---
# Ansible Rollback Playbook
# Task 14/15: Rollback to previous stable release

- name: Rollback Hostel CMS to Previous Stable Release
  hosts: all
  become: yes
  vars:
    app_dir: /opt/hostel-cms
    rollback_image_tag: "{{ rollback_tag | default('previous') }}"

  tasks:

    - name: "Check rollback tag provided"
      debug:
        msg: "Rolling back to image tag: {{ rollback_image_tag }}"

    # ── Stop current containers ─────────────────────────────
    - name: Stop running containers
      shell: |
        cd {{ app_dir }}
        docker-compose down
      ignore_errors: yes

    # ── Health check before rollback ────────────────────────
    - name: Record current state before rollback
      shell: docker ps -a --format "table {{ '{{' }}.Names{{ '}}' }}\t{{ '{{' }}.Status{{ '}}' }}"
      register: pre_rollback_state

    - name: Print pre-rollback state
      debug:
        msg: "{{ pre_rollback_state.stdout_lines }}"

    # ── Pull previous stable image ──────────────────────────
    - name: Pull previous stable Docker image
      shell: |
        docker pull hostelcms/hostel-complaint-system:{{ rollback_image_tag }}
      ignore_errors: yes

    # ── Update docker-compose to use previous tag ────────────
    - name: Set DOCKER_TAG environment for rollback
      lineinfile:
        path: "{{ app_dir }}/.env"
        line: "DOCKER_TAG={{ rollback_image_tag }}"
        create: yes
        state: present

    # ── Restart with previous image ─────────────────────────
    - name: Start previous version
      shell: |
        cd {{ app_dir }}
        DOCKER_TAG={{ rollback_image_tag }} docker-compose up -d
      args:
        chdir: "{{ app_dir }}"

    # ── Health check after rollback ─────────────────────────
    - name: Wait for rolled-back app to start
      uri:
        url: "http://localhost:8080/api/auth/health"
        method: GET
        status_code: 200
      register: health_check
      retries: 10
      delay: 15
      until: health_check.status == 200
      ignore_errors: yes

    - name: Health check result
      debug:
        msg: >-
          Rollback {{ 'SUCCESSFUL' if health_check.status == 200 else 'FAILED' }}
          — App is {{ 'UP' if health_check.status == 200 else 'DOWN' }}

    # ── Idempotency check (run again, same result) ──────────
    - name: "Idempotency: Re-run deploy (should have no changes)"
      shell: |
        cd {{ app_dir }}
        DOCKER_TAG={{ rollback_image_tag }} docker-compose up -d
      register: idempotency_run
      args:
        chdir: "{{ app_dir }}"

    - name: Print idempotency evidence
      debug:
        msg: "{{ idempotency_run.stdout_lines }}"

    - name: Show final container state
      shell: docker ps --format "table {{ '{{' }}.Names{{ '}}' }}\t{{ '{{' }}.Status{{ '}}' }}\t{{ '{{' }}.Ports{{ '}}' }}"
      register: final_state

    - name: Print final state
      debug:
        msg: "{{ final_state.stdout_lines }}"
